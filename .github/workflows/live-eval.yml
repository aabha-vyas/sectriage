# Live eval: real agent runs against one baseline target. Manual only, and it costs money.
#
# Trigger: workflow_dispatch only. Never add a PR or push trigger here.
#
# Secret: ANTHROPIC_API_KEY is an ENVIRONMENT secret on the `live-eval` environment (required
# reviewers, deployment branch `main` only). Use a DEDICATED Anthropic workspace key with its own
# monthly spend limit. That provider-side limit is the only cap that holds across dispatches:
# --budget-usd below is per dispatch, because the spend ledger (logs/evals/spend.json, gitignored)
# starts empty on every fresh runner.
#
# Reading the result: `gate: PASS` means no regression detected against the baseline, not an
# improvement. Exit 1 = regression, 2 = I/O or usage error, 3 = not comparable. A run that stops
# with model_error/internal_error/interrupted fails the job. Report every non-zero outcome; do not
# re-run to get a green.
name: Live eval

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to run (compared with evals/baselines/<target>.json)
        type: choice
        required: true
        default: ledger_api
        options: [ledger_api, notes_portal, static_builder, vuln_app]
      repeat:
        description: Number of agent runs
        type: choice
        required: true
        default: "5"
        options: ["1", "3", "5"]

permissions:
  contents: read

# One live run at a time, so two dispatches cannot spend in parallel.
concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  live-eval:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: live-eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked
      - name: Record existing saved results
        run: ls evals/results > "$RUNNER_TEMP/results-before.txt"
      # evals/live.py wants the key in the process environment AND defined in .env, so it was
      # loaded with `uv run --env-file .env` and not exported. The secret is only in this step's
      # env; the file is mode 600 and removed in the last step.
      - name: Write .env
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "error: ANTHROPIC_API_KEY is not set" >&2; exit 1; }
          umask 077
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > .env
      - name: Live eval
        env:
          TARGET: ${{ inputs.target }}
          REPEAT: ${{ inputs.repeat }}
        run: >-
          uv run --env-file .env python -m evals.run
          --target "$TARGET"
          --repeat "$REPEAT"
          --max-steps 30
          --save
          --baseline "evals/baselines/${TARGET}.json"
          --budget-usd 1.00
          --max-cost-usd 0.25
      # Only files created by this run; committed results in evals/results/ are not uploaded.
      - name: Collect new summary
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/new-results"
          ls evals/results > "$RUNNER_TEMP/results-after.txt"
          comm -13 <(sort "$RUNNER_TEMP/results-before.txt") <(sort "$RUNNER_TEMP/results-after.txt") \
            | while read -r f; do cp "evals/results/$f" "$RUNNER_TEMP/new-results/"; done
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-eval-${{ inputs.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/new-results
          if-no-files-found: warn
          retention-days: 30
      - name: Remove .env
        if: always()
        run: rm -f .env
